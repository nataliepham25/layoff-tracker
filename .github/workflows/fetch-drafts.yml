name: Fetch layoff drafts

# Runs the Google News RSS scraper daily and commits any new files it writes
# to data/drafts. Nothing here ever touches data/layoffs — publishing a
# draft is a manual step on /admin.
on:
  schedule:
    - cron: "17 13 * * *" # ~9:17am US/Eastern; GitHub cron is always UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/fetch-drafts.mjs

      - name: Commit new drafts, if any
        run: |
          git config user.name "layoff-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/drafts
          if git diff --cached --quiet; then
            echo "No new drafts."
          else
            git commit -m "Add new layoff drafts from Google News RSS"
            git push
          fi
